name: Tìm ảnh (kho ảnh mở)

# Free-to-use pictures from open archives (Openverse, Met, Art Institute of Chicago, Cleveland, Europeana; with a
# prefix also the Library of Congress and Wikimedia), licence checked (public domain, CC0, CC BY, CC BY-SA).
# Queries are separated by " || ", or given as one JSON list as in script.json (strings and
# {"q": …, "want": …}). Results (pictures, index.json with licences, contact sheets) go to the renders branch,
# folder image-search/<name>/.
on:
  workflow_dispatch:
    inputs:
      name:
        description: Tên thư mục kết quả (vd gobekli)
        required: true
      queries:
        description: 'Các từ khóa tìm ảnh, ngăn cách bằng " || " (hoặc một danh sách JSON như "queries" trong script.json)'
        required: true

permissions:
  contents: write

jobs:
  find:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NAME: ${{ inputs.name }}
      QUERIES: ${{ inputs.queries }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      # the search ranks its results with CLIP (scripts/find_images.py): the model file (600 MB) is kept between runs
      - name: Mô hình chấm điểm ảnh
        uses: actions/cache@v4
        with:
          path: ~/.cache/find-images
          key: clip-vit-b-32-quickgelu-laion400m-e32
      - name: Tìm và tải ảnh
        run: |
          case "$NAME" in *[!A-Za-z0-9_-]*|'') echo "::error::tên thư mục không hợp lệ"; exit 1;; esac
          pip install -q pillow
          # picture ranking, optional: without it the search keeps the first pictures of every archive
          { pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install -q open_clip_torch; } \
            || echo "::warning::không cài được bộ chấm điểm ảnh: tìm ảnh chạy không xếp hạng"
          python3 - <<'PY'
          import json, os, subprocess
          raw, out = os.environ['QUERIES'].strip(), f"out/{os.environ['NAME']}"
          if raw.startswith('['):   # a JSON list as in script.json: strings and {"q": …, "want": …}
              os.makedirs('out', exist_ok=True)
              json.dump(json.loads(raw), open('out/spec.json', 'w', encoding='utf-8'), ensure_ascii=False)
              args = ['--spec', 'out/spec.json']
          else:
              args = [q.strip() for q in raw.split('||') if q.strip()]
          subprocess.run(['python3', 'scripts/find_images.py', out, *args], check=True)
          PY
      - name: Đưa lên nhánh renders
        run: |
          bash scripts/publish_renders.sh "image-search/$NAME" out/$NAME/*
