name: Video lịch sử (tư liệu thật)

# One issue "[Lịch sử] …" = one vertical history / legend short made from real archive pictures, a Japanese
# voice and subtitles timed to it, laid out as the approved sample (00-video-mau/). Owner opens the issue →
# Claude writes arc/<N>/script.json → this workflow reads the voice (11labs, one job per line), checks it with
# Whisper and searches open archives → Claude chooses the pictures (arc/<N>/picks.json) → this workflow renders →
# Claude checks every shot → done. An owner comment → Claude fixes. Claude's side: AGENT_ARC.md.
# Files: renders branch, folder arc/<N>/.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths: ['arc/**']
  workflow_dispatch:
    inputs:
      issue:
        description: Số phiếu
        required: true
      steps:
        description: 'Bước: prepare (giọng + ảnh), search (tìm thêm ảnh), render (dựng) — cách nhau bằng dấu cách'
        default: render

permissions:
  contents: write
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 1) The owner (or a collaborator) opens a [Lịch sử] issue → wait for Claude's plan, wake Claude now
  start:
    if: >-
      github.event_name == 'issues' && startsWith(github.event.issue.title, '[Lịch sử]')
      && contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, sparse-checkout: scripts }
      # Claude is called before the comment is written, so the comment only says "Claude sẽ…" when the call went
      # through (or a Claude chat already holds the issue with arc-busy); otherwise it says how to call Claude.
      - name: Nhận phiếu và gọi Claude
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          N: ${{ github.event.issue.number }}
          CLAUDE_TASK_URL: ${{ secrets.CLAUDE_TASK_URL }}
          CLAUDE_TASK_TOKEN: ${{ secrets.CLAUDE_TASK_TOKEN }}
          WAKE_COMMENT: '0'
        run: |
          gh issue edit "$N" --add-label arc,arc-plan
          bash scripts/wake_claude.sh "Phiếu lịch sử mới số $N." "$N"
          NOTE=$(cat /tmp/wake_note 2>/dev/null || true)
          if [ -z "$NOTE" ]; then
            gh issue comment "$N" --body "🤖 Đã nhận kịch bản. Claude chia lời theo cảnh (dịch sang tiếng Nhật nếu cần) và chọn từ khóa tìm tư liệu, máy tạo giọng đọc và tìm ảnh, Claude xem và chọn ảnh, máy dựng video, Claude kiểm tra lại từng cảnh. Mỗi bước xong sẽ báo ở đây."
          else
            gh issue comment "$N" --body "🤖 Đã nhận kịch bản. $NOTE"
          fi

  # 2) The owner comments on an archive issue → Claude reads it and fixes
  fix:
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.state == 'open'
      && contains(github.event.issue.labels.*.name, 'arc')
      && github.event.comment.user.type != 'Bot'
      && contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      && !startsWith(github.event.comment.body, '🤖')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, sparse-checkout: scripts }
      - name: Nhận yêu cầu sửa và gọi Claude
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          N: ${{ github.event.issue.number }}
          CLAUDE_TASK_URL: ${{ secrets.CLAUDE_TASK_URL }}
          CLAUDE_TASK_TOKEN: ${{ secrets.CLAUDE_TASK_TOKEN }}
          WAKE_COMMENT: '0'
        run: |
          gh issue edit "$N" --add-label arc-fix --remove-label arc-done || true
          bash scripts/wake_claude.sh "Chủ kênh yêu cầu sửa phiếu lịch sử số $N." "$N"
          NOTE=$(cat /tmp/wake_note 2>/dev/null || true)
          gh issue comment "$N" --body "🤖 Đã nhận yêu cầu sửa. ${NOTE:-Claude sẽ sửa và máy dựng lại.}"

  # 3) Claude pushed arc/<N>/… (or a manual run) → voice + pictures, or the video
  work:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # No concurrency group, on purpose. Each run does only what its own push changed, and GitHub keeps one pending
    # run per group: a third push would cancel the pending one and its step (a search round, the voice) would
    # never run. The issue number is also only known after the "Việc cần làm" step, too late for a job-level
    # group. Two runs on one issue are made safe in run.py instead: publishing starts again from the fresh tip of
    # renders, a render whose pictures are not published yet stops with a clear message, and step labels are
    # not set over a render that is running.
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VN11_API_KEY: ${{ secrets.VN11_API_KEY }}
      CLAUDE_TASK_URL: ${{ secrets.CLAUDE_TASK_URL }}
      CLAUDE_TASK_TOKEN: ${{ secrets.CLAUDE_TASK_TOKEN }}
      FONTSOURCE: /tmp/fontsource
      PYTHONUNBUFFERED: '1'
      BEFORE: ${{ github.event.before }}
      IN_ISSUE: ${{ inputs.issue }}
      IN_STEPS: ${{ inputs.steps }}
    steps:
      - uses: actions/checkout@v4
      - name: Việc cần làm
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            case "$IN_ISSUE" in ''|*[!0-9]*) echo "::error::số phiếu không hợp lệ"; exit 1;; esac
            S=""; for s in $IN_STEPS; do case "$s" in prepare|search|render) S="$S $s";; esac; done
            echo "$IN_ISSUE$S" > /tmp/todo.txt
          else
            # files changed by this push (only the last commit's when the old head cannot be fetched); NUL-separated
            # and unquoted, so names with spaces or accents survive
            { git fetch -q --depth 1 origin "$BEFORE" 2>/dev/null && git -c core.quotePath=false diff -z --name-only "$BEFORE" HEAD -- arc/ > /tmp/files.txt; } \
              || git -c core.quotePath=false show -z --name-only --format= HEAD -- arc/ > /tmp/files.txt
            python3 -c '
          import re, sys, collections
          todo = collections.OrderedDict()
          for f in sys.stdin.buffer.read().decode("utf-8", "replace").split("\0"):
              m = re.match(r"arc/(\d+)/(.+)$", f.strip("\n"))
              if not m: continue
              n, rest = m.groups()
              s = todo.setdefault(n, [])
              step = "prepare" if rest == "script.json" else "search" if re.match(r"search-\w+\.json$", rest) else "render" if rest == "picks.json" or rest.startswith("own/") else None
              if step and step not in s: s.append(step)
          order = ["prepare", "search", "render"]
          print("\n".join(n + " " + " ".join(sorted(s, key=order.index)) for n, s in todo.items() if s))' < /tmp/files.txt > /tmp/todo.txt
          fi
          cat /tmp/todo.txt
          [ -s /tmp/todo.txt ] && echo "TODO=1" >> "$GITHUB_ENV" || echo "Không có việc."
      - name: Cài công cụ
        if: env.TODO == '1'
        run: |
          # pinned to the versions tested together (PyAV 19 breaks faster-whisper 1.2: "metadata_errors")
          pip install -q numpy scipy pillow pykakasi==2.3.0 faster-whisper==1.1.1 av==13.1.0 imageio-ffmpeg==0.8.1
          npm ci --no-audit --no-fund
          npx remotion browser ensure
          bash scripts/arc/get_fonts.sh "$FONTSOURCE"
      - name: Chạy
        if: env.TODO == '1'
        run: |
          FAIL=0
          : > /tmp/handled.txt
          while read -r N STEPS; do
            echo "::group::phiếu #$N: $STEPS"
            # < /dev/null: nothing inside run.py may read the rest of the to-do list from the loop's stdin
            if ! python3 scripts/arc/run.py "$N" $STEPS < /dev/null; then
              FAIL=1
              gh issue edit "$N" --add-label arc-failed --remove-label arc-voice --remove-label arc-render < /dev/null || true
              WAKE_COMMENT=0 bash scripts/wake_claude.sh "Phiếu lịch sử số $N bị lỗi ở bước $STEPS." "$N" < /dev/null || true
              NOTE=$(cat /tmp/wake_note 2>/dev/null || true)
              gh issue comment "$N" --body "🤖 Máy gặp lỗi ở bước \`$STEPS\` — xem nhật ký: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID . ${NOTE:-Claude sẽ xem và sửa.}" < /dev/null || true
            fi
            echo "$N" >> /tmp/handled.txt
            echo "::endgroup::"
          done < /tmp/todo.txt
          exit $FAIL
      # The job stopped outside run.py (tools failed to install, time limit, cancelled): issues the loop did not reach
      # would keep arc-voice/arc-render forever, so they are marked failed here.
      - name: Báo lỗi cho phiếu chưa chạy
        if: (failure() || cancelled()) && env.TODO == '1'
        run: |
          touch /tmp/handled.txt
          while read -r N STEPS; do
            [ -n "$N" ] || continue
            grep -qx "$N" /tmp/handled.txt && continue
            gh issue edit "$N" --add-label arc-failed < /dev/null || true
            gh issue edit "$N" --remove-label arc-voice --remove-label arc-render < /dev/null || true
            WAKE_COMMENT=0 bash scripts/wake_claude.sh "Phiếu lịch sử số $N: máy dừng giữa chừng ở bước $STEPS." "$N" < /dev/null || true
            NOTE=$(cat /tmp/wake_note 2>/dev/null || true)
            gh issue comment "$N" --body "🤖 Máy dừng giữa chừng trước khi làm xong bước \`$STEPS\` (lỗi cài đặt, quá giờ hoặc bị hủy) — xem nhật ký: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID . ${NOTE:-Claude sẽ xem và chạy lại.}" < /dev/null || true
          done < /tmp/todo.txt
          true
