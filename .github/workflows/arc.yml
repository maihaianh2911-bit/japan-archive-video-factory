name: Video lịch sử (tư liệu thật)

# One issue "[Lịch sử] …" = one vertical history / legend short made from real archive pictures, a Japanese
# voice and subtitles timed to it, laid out as the approved sample (00-video-mau/). Owner opens the issue →
# Claude writes arc/<N>/script.json → this workflow reads the voice (11labs, one job per line), checks it with
# Whisper and searches open archives → Claude chooses the pictures (arc/<N>/picks.json) → this workflow renders →
# Claude checks every shot → done. An owner comment → Claude fixes. Claude's side: AGENT_ARC.md.
# Files: renders branch, folder arc/<N>/.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths: ['arc/**']
  workflow_dispatch:
    inputs:
      issue:
        description: Số phiếu
        required: true
      steps:
        description: 'Bước: prepare (giọng + ảnh), search (tìm thêm ảnh), render (dựng) — cách nhau bằng dấu cách'
        default: render

permissions:
  contents: write
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 1) The owner (or a collaborator) opens a [Lịch sử] issue → wait for Claude's plan, wake Claude now
  start:
    if: >-
      github.event_name == 'issues' && startsWith(github.event.issue.title, '[Lịch sử]')
      && contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, sparse-checkout: scripts }
      - name: Nhận phiếu
        env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}', N: '${{ github.event.issue.number }}' }
        run: |
          gh issue edit "$N" --add-label arc,arc-plan
          gh issue comment "$N" --body "🤖 Đã nhận kịch bản. Claude chia lời theo cảnh (dịch sang tiếng Nhật nếu cần) và chọn từ khóa tìm tư liệu, máy tạo giọng đọc và tìm ảnh, Claude xem và chọn ảnh, máy dựng video, Claude kiểm tra lại từng cảnh. Mỗi bước xong sẽ báo ở đây."
      - name: Gọi Claude
        env: { CLAUDE_TASK_URL: '${{ secrets.CLAUDE_TASK_URL }}', CLAUDE_TASK_TOKEN: '${{ secrets.CLAUDE_TASK_TOKEN }}' }
        run: bash scripts/wake_claude.sh "Phiếu lịch sử mới số ${{ github.event.issue.number }}."

  # 2) The owner comments on an archive issue → Claude reads it and fixes
  fix:
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.state == 'open'
      && contains(github.event.issue.labels.*.name, 'arc')
      && github.event.comment.user.type != 'Bot'
      && contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      && !startsWith(github.event.comment.body, '🤖')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, sparse-checkout: scripts }
      - name: Nhận yêu cầu sửa
        env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}', N: '${{ github.event.issue.number }}' }
        run: |
          gh issue edit "$N" --add-label arc-fix --remove-label arc-done || true
          gh issue comment "$N" --body "🤖 Đã nhận yêu cầu. Claude sẽ sửa và máy dựng lại."
      - name: Gọi Claude
        env: { CLAUDE_TASK_URL: '${{ secrets.CLAUDE_TASK_URL }}', CLAUDE_TASK_TOKEN: '${{ secrets.CLAUDE_TASK_TOKEN }}' }
        run: bash scripts/wake_claude.sh "Chủ kênh yêu cầu sửa phiếu lịch sử số ${{ github.event.issue.number }}."

  # 3) Claude pushed arc/<N>/… (or a manual run) → voice + pictures, or the video
  work:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 150   # no concurrency group: a pending run would be dropped when a third push arrives
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VN11_API_KEY: ${{ secrets.VN11_API_KEY }}
      CLAUDE_TASK_URL: ${{ secrets.CLAUDE_TASK_URL }}
      CLAUDE_TASK_TOKEN: ${{ secrets.CLAUDE_TASK_TOKEN }}
      FONTSOURCE: /tmp/fontsource
      PYTHONUNBUFFERED: '1'
      BEFORE: ${{ github.event.before }}
      IN_ISSUE: ${{ inputs.issue }}
      IN_STEPS: ${{ inputs.steps }}
    steps:
      - uses: actions/checkout@v4
      - name: Việc cần làm
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            case "$IN_ISSUE" in ''|*[!0-9]*) echo "::error::số phiếu không hợp lệ"; exit 1;; esac
            S=""; for s in $IN_STEPS; do case "$s" in prepare|search|render) S="$S $s";; esac; done
            echo "$IN_ISSUE$S" > /tmp/todo.txt
          else
            # files changed by this push (only the last commit's when the old head cannot be fetched)
            git fetch -q --depth 1 origin "$BEFORE" 2>/dev/null && FILES=$(git diff --name-only "$BEFORE" HEAD -- arc/) || FILES=$(git show --name-only --format= HEAD -- arc/)
            printf '%s\n' "$FILES" | python3 -c '
          import re, sys, collections
          todo = collections.OrderedDict()
          for f in sys.stdin.read().split():
              m = re.match(r"arc/(\d+)/(.+)$", f)
              if not m: continue
              n, rest = m.groups()
              s = todo.setdefault(n, [])
              step = "prepare" if rest == "script.json" else "search" if re.match(r"search-\w+\.json$", rest) else "render" if rest == "picks.json" or rest.startswith("own/") else None
              if step and step not in s: s.append(step)
          order = ["prepare", "search", "render"]
          print("\n".join(n + " " + " ".join(sorted(s, key=order.index)) for n, s in todo.items() if s))' > /tmp/todo.txt
          fi
          cat /tmp/todo.txt
          [ -s /tmp/todo.txt ] && echo "TODO=1" >> "$GITHUB_ENV" || echo "Không có việc."
      - name: Cài công cụ
        if: env.TODO == '1'
        run: |
          # pinned to the versions tested together (PyAV 19 breaks faster-whisper 1.2: "metadata_errors")
          pip install -q numpy scipy pillow pykakasi==2.3.0 faster-whisper==1.1.1 av==13.1.0 imageio-ffmpeg==0.8.1
          npm ci --no-audit --no-fund
          npx remotion browser ensure
          bash scripts/arc/get_fonts.sh "$FONTSOURCE"
      - name: Chạy
        if: env.TODO == '1'
        run: |
          FAIL=0
          while read -r N STEPS; do
            echo "::group::phiếu #$N: $STEPS"
            if ! python3 scripts/arc/run.py "$N" $STEPS; then
              FAIL=1
              gh issue edit "$N" --add-label arc-failed --remove-label arc-voice --remove-label arc-render || true
              gh issue comment "$N" --body "🤖 Máy gặp lỗi ở bước \`$STEPS\` — xem nhật ký: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID . Claude sẽ xem và sửa." || true
              bash scripts/wake_claude.sh "Phiếu lịch sử số $N bị lỗi ở bước $STEPS." || true
            fi
            echo "::endgroup::"
          done < /tmp/todo.txt
          exit $FAIL
